{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm with OTP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-lg rounded-4 p-4 text-center" style="max-width: 500px; width: 100%;">

    <h1 class="fw-bold fs-2 mb-4">Confirm with OTP</h1>

    <p class="text-muted">Please check your email address for OTP</p>
    {% if messages %}
  <div>
    {% for message in messages %}
      <p class="alert alert-{{ message.tags }}">{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}


    <!-- OTP Form -->
    <form id="otpForm" method="POST" action="{% url 'verify_otp' %}">
      {% csrf_token %}

      <!-- OTP input fields -->
      <div class="d-flex justify-content-center gap-2 my-4">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
      </div>

      <!-- Hidden field to store full OTP -->
      <input type="hidden" name="otp" id="otpField">

      <!-- Timer -->
      <div class="mb-3">
        <span class="fw-bold">Remaining Time:</span> 
        <span id="timer" class="text-primary fw-bold">01:00s</span>
      </div>

      <!-- Buttons -->
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-dark btn-lg">Confirm</button>
        <a href="{% url 'signup' %}" class="btn btn-outline-secondary">Go back to Signup page</a>
      </div>
    </form>

    <!-- Resend -->
<form method="POST" action="{% url 'resend_otp' %}" class="mt-3">
  {% csrf_token %}
  <button id="resendBtn" class="btn btn-secondary" type="submit" disabled>Resend OTP</button>
</form>
  </div>
</div>
</div>
</div>
<script>
  let timeLeft = 60; // seconds
let timerDisplay = document.getElementById("timer");
let resendBtn = document.getElementById("resendBtn");

let countdown = setInterval(() => {
  let minutes = String(Math.floor(timeLeft / 60)).padStart(2, "0");
  let seconds = String(timeLeft % 60).padStart(2, "0");
  timerDisplay.textContent = `${minutes}:${seconds}s`;

  if (timeLeft <= 0) {
    clearInterval(countdown);
    timerDisplay.textContent = "00:00s";
    resendBtn.disabled = false;   // ✅ Enable resend button
    resendBtn.classList.remove("btn-secondary");
    resendBtn.classList.add("btn-success"); // just for effect
  }

  timeLeft--;
}, 1000);
  // OTP input joining
  let otpInputs = document.querySelectorAll(".otp-input");
  let otpField = document.getElementById("otpField");
  let otpForm = document.getElementById("otpForm");

  otpForm.addEventListener("submit", () => {
    let otpValue = "";
    otpInputs.forEach(input => otpValue += input.value);
    otpField.value = otpValue;  // put full OTP into hidden field
  });

  // Auto move to next input
  otpInputs.forEach((input, index) => {
    input.addEventListener("input", () => {
      if (input.value.length === 1 && index < otpInputs.length - 1) {
        otpInputs[index + 1].focus();
      }
    });
  });
</script>

</body>
</html>
