{% extends "base.html" %}

{% block title %}Server Error - 500{% endblock %}

{% block content %}

<div class="error-container" style="text-align: center; padding: 50px 20px;">
    <h1 style="font-size: 72px; margin: 0; color: #dc3545;">500</h1>
    <h2 style="font-size: 24px; color: #333; margin: 20px 0;">Server Error</h2>

    </a>
</div>
{% endblock %}
