{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'style.css' %}">

  <style>
    body {
      background: linear-gradient(to right, #f8f9fa, #e9ecef);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-5px);
    }

    h3 {
      font-size: 1.8rem;
      color: #343a40;
    }

    .form-control {
      border-radius: 10px;
      padding: 12px;
      border: 1px solid #ced4da;
      transition: border-color 0.3s;
    }

    .form-control:focus {
      border-color: #495057;
      box-shadow: none;
    }

    .btn-dark {
      background-color: #343a40;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .btn-dark:hover {
      background-color: #495057;
    }

    .forgot-link {
      font-size: 0.9rem;
      color: #6c757d;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .right-image img {
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-height: 490px;
      object-fit: cover;
    }

    @media (max-width: 767px) {
      .login-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="row w-100" style="max-width: 900px;">

    <!-- Left side: Login Form -->
    <div class="col-md-6 d-flex align-items-center">
      <div class="login-card w-100">

        <!-- Title -->
        <h3 class="text-center fw-bold mb-4">Login</h3>

        <!-- Form -->
        <form action="{% url 'admin_login' %}" method="post">
          {% csrf_token %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}

          <div class="mb-3">
            <label class="form-label text-secondary">Email</label>
            <input type="email" class="form-control" placeholder="Enter your email" name="email" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-secondary">Password</label>
            <input type="password" class="form-control" placeholder="Enter your password" name="password" required>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <a href="{% url 'forgot_password' %}" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-dark w-100 mb-3">Login</button>
        </form>
      </div>
    </div>

    <!-- Right side: Image -->
    <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center right-image">
      <img src="{% static 'images/men2.jpeg' %}" alt="Logo" class="img-fluid w-100">
    </div>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
