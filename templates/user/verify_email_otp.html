{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - Change Email</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-lg rounded-4 p-4 text-center" style="max-width: 500px; width: 100%;">
    
    <h1 class="fw-bold fs-2 mb-3">Verify OTP</h1>
    <p class="text-muted">We’ve sent a 6-digit OTP to your <b>{{ user.email }}</b>. Enter it below to confirm email change.</p>

    <!-- OTP Form -->
    <form method="POST" action="{% url 'verify_email_change_otp' %}">
      {% csrf_token %}

      <!-- OTP input fields -->
      <div class="d-flex justify-content-center gap-2 my-4">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
      </div>

      <!-- Hidden field to join OTP -->
      <input type="hidden" name="otp" id="otpField">

      <!-- Timer -->
      <div class="mb-3">
        <span class="fw-bold">Remaining Time:</span> 
        <span id="timer" class="text-primary fw-bold">5:00</span>
      </div>

      <!-- Buttons -->
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-dark btn-lg">Verify & Continue</button>
        <a href="{% url 'user_profile' user.id %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>

    <!-- Resend OTP -->
    <form method="POST" action="{% url 'resend_email_change_otp' %}" class="mt-3">
      {% csrf_token %}
      <button id="resendBtn" class="btn btn-secondary" type="submit" disabled>Resend OTP</button>
    </form>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ================= OTP JOIN FUNCTION =================
document.querySelector("form").addEventListener("submit", function() {
    let otpInputs = document.querySelectorAll(".otp-input");
    let otpValue = "";

    otpInputs.forEach(input => {
        otpValue += input.value.trim();
    });

    document.getElementById("otpField").value = otpValue;
});


// ================= OTP AUTO MOVE NEXT INPUT =================
document.querySelectorAll(".otp-input").forEach((input, index, inputs) => {

    input.addEventListener("input", function() {
        if (this.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
    });

    input.addEventListener("keydown", function(e) {
        if (e.key === "Backspace" && this.value === "" && index > 0) {
            inputs[index - 1].focus();
        }
    });
});


// ================= TIMER SECTION =================
let timeLeft = 300; // 5 minutes (300 seconds)
let timerEl = document.getElementById("timer");
let resendBtn = document.getElementById("resendBtn");

function updateTimer() {

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    timerEl.textContent =
        `${minutes < 10 ? "0" + minutes : minutes}:` +
        `${seconds < 10 ? "0" + seconds : seconds}`;

    if (timeLeft <= 0) {
        clearInterval(countdown);
        timerEl.textContent = "Expired!";
        resendBtn.disabled = false;

        // Optional: disable OTP inputs after expiry
        document.querySelectorAll(".otp-input").forEach(input => {
            input.disabled = true;
        });

        return;
    }

    timeLeft--;
}

// Show 05:00 immediately
updateTimer();

// Start countdown
let countdown = setInterval(updateTimer, 1000);
</script>


</body>
</html>
