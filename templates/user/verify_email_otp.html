{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - Change Email</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-lg rounded-4 p-4 text-center" style="max-width: 500px; width: 100%;">
    
    <h1 class="fw-bold fs-2 mb-3">Verify OTP</h1>
    <p class="text-muted">We’ve sent a 6-digit OTP to your <b>new email</b>. Enter it below to confirm email change.</p>

    <!-- OTP Form -->
    <form method="POST" action="{% url 'verify_email_change_otp' %}">
      {% csrf_token %}

      <!-- OTP input fields -->
      <div class="d-flex justify-content-center gap-2 my-4">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
        <input type="text" maxlength="1" class="form-control text-center fs-4 otp-input" style="width:60px;">
      </div>

      <!-- Hidden field to join OTP -->
      <input type="hidden" name="otp" id="otpField">

      <!-- Timer -->
      <div class="mb-3">
        <span class="fw-bold">Remaining Time:</span> 
        <span id="timer" class="text-primary fw-bold">01:00s</span>
      </div>

      <!-- Buttons -->
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-dark btn-lg">Verify & Continue</button>
        <a href="{% url 'user_profile' user.id %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>

    <!-- Resend OTP -->
    <form method="POST" action="{% url 'resend_email_change_otp' %}" class="mt-3">
      {% csrf_token %}
      <button id="resendBtn" class="btn btn-secondary" type="submit" disabled>Resend OTP</button>
    </form>

  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Join OTP inputs into hidden field
document.querySelector("form").addEventListener("submit", function(){
  let otpInputs = document.querySelectorAll(".otp-input");
  let otpValue = "";
  otpInputs.forEach(input => otpValue += input.value);
  document.getElementById("otpField").value = otpValue;
});

// Timer
let timeLeft = 60;
let timerEl = document.getElementById("timer");
let resendBtn = document.getElementById("resendBtn");

let countdown = setInterval(() => {
  if (timeLeft <= 0) {
    clearInterval(countdown);
    timerEl.textContent = "Expired!";
    resendBtn.disabled = false;
  } else {
    timerEl.textContent = `00:${timeLeft < 10 ? "0"+timeLeft : timeLeft}s`;
  }
  timeLeft -= 1;
}, 1000);
</script>

</body>
</html>
