{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Send OTP</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Fonts -->
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Vollkorn:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #e3f2fd, #ffffff);
      min-height: 100vh;
      margin: 0;
    }

    .otp-card {
      max-width: 400px;
      margin: 20px auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 15px;
      color: #484848;
      transition: transform 0.3s ease;
    }

    .otp-card:hover {
      transform: translateY(-5px);
    }

   

    .form-label {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      color: #484848;
    }

    .form-control {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      border-color: #2193b0;
      border-radius: 10px;
      padding: 0.5rem;
    }

    .btn-otp {
      
      font-weight: 700;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      text-transform: uppercase;
      color: #ffffff;
      background: linear-gradient(135deg, #6dd5ed, #2193b0);
      border: none;
      border-radius: 10px;
      padding: 0.5rem 1rem;
      transition: background 0.3s ease;
    }

    .btn-otp:hover {
      background: linear-gradient(135deg, #2193b0, #6dd5ed);
    }

  

    .go-back:hover {
      text-decoration: underline;
      color: #0170bc;
    }

    .alert {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      border-radius: 10px;
      margin-bottom: 10px;
      padding: 0.5rem;
    }

    @media (max-width: 768px) {
      .otp-card {
        padding: 10px;
        margin: 10px auto;
      }
      h1 {
        font-size: clamp(1.2rem, 4vw, 1.8rem);
      }
      p, .form-label, .form-control, .btn-otp {
        font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      }
    }
  </style>
</head>
<body class="fp_body">

<div class="container my-5 py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="otp-card">
        <h2 class="mb-2 text-center fw-bold text-primary ">Forgot Password?</h2>
        <p class="text-center mb-2 ">Please confirm your email address</p>
        <form action="{% url 'forgot_password' %}" method="post">
          {% csrf_token %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}

          <div class="mb-2">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email", name="email">
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-otp btn-lg">Send OTP</button>
          </div>
        </form>
        <div class="text-center mt-2">
          <a href="{% url 'login' %}" class="go-back">Go back to Login page</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
