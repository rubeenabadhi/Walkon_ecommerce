{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif; /* Assumed from your project, adjust if different */
      background: linear-gradient(135deg, #ffffff);
      min-height: 100vh;
      margin: 0;
    }

    .login-card {
      max-width: 400px;
      margin: 20px auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 15px;
      color: #484848;
      transition: transform 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-5px);
    }

    h3 {
      
      font-weight: 700;
      font-size: clamp(1.5rem, 4vw, 2rem);
      color: #d4af37;
      text-align: center;
    }

    .form-control {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      border-color: #d4af37;
      border-radius: 10px;
      padding: 0.5rem;
    }

    .btn-dark {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      text-transform: uppercase;
      border-radius: 10px;
      padding: 0.5rem;
      background: #000000;
      transition: background 0.3s ease;
    }

    .btn-dark:hover {
      background: #333333;
    }

    .forgot-link, .signup-link {
      font-family: 'Outfit', sans-serif;
      font-weight: 400;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      color: #d4af37;
      text-decoration: none;
    }

    .forgot-link:hover, .signup-link:hover {
      text-decoration: underline;
      color: #d4af37;
    }

    .alert {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      border-radius: 10px;
      margin-bottom: 10px;
      padding: 0.5rem;
    }

    img {
      max-height: 80px;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .login-card {
        padding: 10px;
        margin: 10px auto;
      }
      h3 {
        font-size: clamp(1.2rem, 4vw, 1.8rem);
      }
      .form-control, .btn-dark {
        font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      }
    }
  </style>
</head>
<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="login-card w-100">
    
    <!-- Logo -->
    <div class="text-center mb-3">
      <img src="{% static 'images/kids5.jpeg' %}" alt="Logo" class="img-fluid" style="max-height: 80px;">
    </div>

    <!-- Title -->
    <h3 class="text-center fw-bold mb-3">Change Password</h3>

    <!-- Form -->
    <form action="{% url 'reset_password' %}" method="post">
      {% csrf_token %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
      <div class="mb-2">
        <input type="password" class="form-control" placeholder="New Password" name="new_password">
      </div>
      <div class="mb-2">
        <input type="password" class="form-control" placeholder="Confirm Password" name="confirm_password">
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-dark w-100 mb-3">Reset</button>
    </form>

    <!-- Signup link -->
    <p class="mt-3 text-center">
      Go back to login page <a href="#" class="signup-link">Click here!</a>
    </p>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
