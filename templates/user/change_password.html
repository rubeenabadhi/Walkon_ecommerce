{% extends 'user/base.html' %}
{% load static %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card shadow rounded-4">
        <div class="card-body p-4">
          <h3 class="text-center fw-bold mb-4">Change Password</h3>

          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
              </div>
            {% endfor %}
          {% endif %}

          <form method="post">
            {% csrf_token %}
            
            <!-- Old Password -->
            <div class="mb-3 input-group">
              <input type="password" name="old_password" id="old_password" class="form-control" placeholder="Old Password" required>
              <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('old_password', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>

            <!-- New Password -->
            <div class="mb-3 input-group">
              <input type="password" name="new_password" id="new_password" class="form-control" placeholder="New Password" required>
              <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('new_password', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3 input-group">
              <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Confirm Password" required>
              <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirm_password', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>

            <button type="submit" class="btn btn-dark w-100">🔑 Update Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap + Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function togglePassword(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector("i");

    if (field.type === "password") {
      field.type = "text";
      icon.classList.remove("bi-eye");
      icon.classList.add("bi-eye-slash");
    } else {
      field.type = "password";
      icon.classList.remove("bi-eye-slash");
      icon.classList.add("bi-eye");
    }
  }
</script>
{% endblock %}
