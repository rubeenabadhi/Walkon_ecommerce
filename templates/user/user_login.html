{% load static %}
{% load socialaccount %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WalkOn Login</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/signup.css' %}">
  
</head>
<body>
<div class="container py-5 mt-5"> 
  <div class="row justify-content-center">
    <!-- Signup Card with Image and Form -->
    <div class="col-md-10 col-lg-8">
      <div class="signup-card">
        <div class="row g-0 h-100">
          <!-- Image Section -->
          <div class="col-lg-6">
            <div class="image-container">
              <img src="{% static 'images/card.jpg' %}" alt="Shoe" class="w-100 h-100">
            </div>
          </div>
          <!-- Form Section -->
          <div class="col-lg-6 p-2">
            <h2 class="text-center fw-bold mb-3 text-primary ">LOGIN</h2>

            <!-- Form -->
            <form action="{% url 'login' %}" method="post">
              {% csrf_token %}
              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                {% endfor %}
              {% endif %}
              <div class="mb-1">
                <label class="form-label text-secondary">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email" name="email">
              </div>
              <div class="mb-1">
                <label class="form-label text-secondary">Password</label>
                <input type="password" class="form-control" placeholder="Enter your password" name="password">
              </div>
              <div class="d-flex justify-content-between align-items-center mb-2">
                <a href="{% url 'forgot_password' %}" class="forgot-link">Forgot password?</a>
              </div>
              <button type="submit" class="btn btn-primary w-100 mb-2">Login</button>
            </form>

            <!-- Divider -->
            <div class="d-flex align-items-center my-1">
              <hr class="flex-grow-1">
              <span class="mx-2 text-muted">or</span>
              <hr class="flex-grow-1">
            </div>

            <!-- Google Login -->
            <a href="{% provider_login_url 'google' %}" class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center">
              <img src="{% static 'icons/google_icon.jpeg' %}" alt="Google" class="me-2" style="width:15px;">
              Continue with Google
            </a>

            <!-- Signup link -->
            <p class="mt-2 text-center">
              New User? <a href="{% url 'signup' %}" class="signup-link">Sign up now..!</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
