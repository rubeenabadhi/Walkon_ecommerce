{% load static %}
{% load socialaccount %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WalkOn Create Account</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/signup.css' %}">
 
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <!-- Signup Card with Image and Form -->
    <div class="col-md-10 col-lg-8">
      <div class="signup-card">
        <div class="row g-0 h-100">
          <!-- Image Section -->
          <div class="col-lg-6">
            <div class="image-container">
              <img src="{% static 'images/shoebanner.jpg' %}" alt="Shoe" class="w-100 h-100">
            </div>
          </div>
          <!-- Form Section -->
          <div class="col-lg-6 p-2">
            <h2 class="text-center mb-3 fw-bold">Create Account</h2>
            
            <!-- Signup Form -->
            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show rounded-3 shadow-sm d-inline-block signup-alert text-danger" role="alert">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              {% endfor %}
            {% endif %}
            <form method="POST" action="{% url 'signup' %}">
              {% csrf_token %}

              <div class="mb-1">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" id="id_username" name="username" class="form-control" required>
              </div>

              <div class="mb-1">
                <label for="id_email" class="form-label">Email</label>
                <input type="email" id="id_email" name="email" class="form-control" style="text-transform: lowercase;" required>
              </div>

              <div class="mb-1">
                <label for="id_password" class="form-label">Password</label>
                <input type="password" id="id_password" name="password" class="form-control" required>
              </div>

              <div class="mb-1">
                <label for="id_password2" class="form-label">Confirm Password</label>
                <input type="password" id="id_password2" name="password2" class="form-control" required>
              </div>
              <!--referral-->
              <div class="mb-1">
                <label for="id_referral" class="form-label">Referral Code (Optional)</label>
                <input type="text" id="id_referral" name="referrel_code" class="form-control"  value="{{ referral_code|default:'' }}">
              </div>

              <div class="mb-1 form-check">
                <input type="checkbox" class="form-check-input" id="termsCheck" required>
                <label class="form-check-label" for="termsCheck">I agree to the <a href="#">Terms and Conditions</a></label>
              </div>

              <button type="submit" class="btn btn-primary w-100">Sign Up</button>
            </form>

            <!-- Divider -->
            <div class="text-center my-1">
              <small class="text-muted">OR</small>
            </div>

            <!-- Google Login -->
            <a href="{% provider_login_url 'google' %}" class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center">
              <img src="{% static 'icons/google_icon.jpeg' %}" alt="Google" class="me-2" style="width:15px;">
              Sign up with Google
            </a>

            <!-- Login link -->
            <p class="mt-2 text-center">
              Already have an account? <a href="{% url 'login' %}">Login now</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
